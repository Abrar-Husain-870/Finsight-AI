services:
  - type: web
    name: finsight-backend
    runtime: node
    plan: free
    region: oregon
    buildCommand: pnpm install && pnpm --filter @finsight/shared run build && pnpm --filter @finsight/backend exec prisma generate && pnpm --filter @finsight/backend run build
    startCommand: pnpm --filter @finsight/backend exec prisma db push && pnpm --filter @finsight/backend start
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 3001
      - key: DATABASE_URL
        fromDatabase:
          name: finsight-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_REFRESH_SECRET
        generateValue: true
      - key: ENCRYPTION_KEY
        generateValue: true
      - key: FRONTEND_URL
        value: https://finsight-ai-updated.vercel.app
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: GOOGLE_CLIENT_SECRET
        sync: false
      - key: GROQ_API_KEY
        sync: false
      - key: DEFAULT_AI_PROVIDER
        value: groq
      - key: DEFAULT_AI_MODEL
        value: qwen/qwen3.8-27b

databases:
  - name: finsight-db
    plan: free
    region: oregon
