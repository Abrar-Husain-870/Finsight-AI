services:
  - type: web
    name: finsight-backend
    runtime: node
    plan: free
    region: oregon
    buildCommand: pnpm install && pnpm --filter @finsight/backend exec prisma generate && pnpm --filter @finsight/backend run build && pnpm --filter @finsight/backend exec prisma db push
    startCommand: pnpm --filter @finsight/backend start
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 3001
      - key: DATABASE_URL
        fromDatabase:
          name: finsight-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_REFRESH_SECRET
        generateValue: true
      - key: ENCRYPTION_KEY
        generateValue: true
      - key: FRONTEND_URL
        value: http://localhost:5173
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: GOOGLE_CLIENT_SECRET
        sync: false

databases:
  - name: finsight-db
    plan: free
    region: oregon
